<style>
:root{
  --bl-bg:#0C0D0E;
  --bl-surface:#1c1c1e;
  --bl-surface2:#252527;
  --bl-border:#353537;
  --bl-text:#FFFFFF;
  --bl-text-muted:#a8aab0;
  --bl-text-dim:#525861;
  --bl-orange:#F26828;
  --bl-orange-deep:#E35C1F;
  --bl-orange-soft:#FFBC7D;
  --bl-blue:#1E88E5;
  --bl-blue-deep:#005CB9;
  --bl-radius:10px;
  --bl-radius-sm:6px;
  --bl-shadow:0 4px 24px rgba(0,0,0,.55);
  --panel-w:380px;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bl-bg);color:var(--bl-text);
  font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;-webkit-font-smoothing:antialiased}

#bl-locations{position:fixed;inset:0;display:flex;flex-direction:column}

/* ── Header ───────────────────────────────────────── */
.bl-header{
  display:flex;align-items:center;gap:24px;
  padding:14px 20px;background:linear-gradient(180deg,#0C0D0E 0%,#141416 100%);
  border-bottom:1px solid var(--bl-border);z-index:1000;flex:0 0 auto;
}
.bl-header h1{margin:0;font-size:18px;font-weight:600;letter-spacing:.3px}
.bl-header .sub{color:var(--bl-text-muted);font-size:13px;margin-left:4px}

/* ── Toolbar ──────────────────────────────────────── */
.bl-toolbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 20px;background:var(--bl-surface);border-bottom:1px solid var(--bl-border);
  z-index:900;flex:0 0 auto;
}
.bl-toolbar input,.bl-toolbar select{
  background:var(--bl-surface2);color:var(--bl-text);border:1px solid var(--bl-border);
  border-radius:var(--bl-radius-sm);padding:8px 12px;font:inherit;font-size:13px;
  outline:none;transition:border-color .15s;
}
.bl-toolbar input::placeholder{color:var(--bl-text-dim)}
.bl-toolbar input:focus,.bl-toolbar select:focus{border-color:var(--bl-orange)}
.bl-toolbar input[type=search]{min-width:220px;flex:1 1 220px;max-width:340px}
.bl-toolbar select{min-width:160px}

.bl-toggle{display:inline-flex;border:1px solid var(--bl-border);border-radius:var(--bl-radius-sm);overflow:hidden;background:var(--bl-surface2)}
.bl-toggle button{
  background:transparent;color:var(--bl-text-muted);border:0;
  padding:8px 14px;font:inherit;font-size:13px;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;
}
.bl-toggle button + button{border-left:1px solid var(--bl-border)}
.bl-toggle button.active{background:var(--bl-orange);color:#fff}
.bl-toggle button:not(.active):hover{background:var(--bl-border);color:var(--bl-text)}
.bl-toggle .dot{width:8px;height:8px;border-radius:50%}
.bl-toggle .dot.corp{background:var(--bl-orange)}
.bl-toggle .dot.dist{background:var(--bl-blue)}

.bl-count{margin-left:auto;color:var(--bl-text-muted);font-size:12px;letter-spacing:.5px;text-transform:uppercase}
.bl-count strong{color:var(--bl-text);font-weight:600}

/* ── Map ──────────────────────────────────────────── */
.bl-map-wrap{position:relative;flex:1 1 auto;min-height:0}
#bl-map{position:absolute;inset:0;background:#0a0b0d}
.leaflet-container{background:#0a0b0d;font-family:inherit}
.leaflet-control-attribution{background:rgba(12,13,14,.7)!important;color:var(--bl-text-muted)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--bl-text-muted)!important}
.leaflet-control-zoom a{
  background:var(--bl-surface)!important;color:var(--bl-text)!important;
  border:1px solid var(--bl-border)!important;
}
.leaflet-control-zoom a:hover{background:var(--bl-surface2)!important;color:var(--bl-orange)!important}

/* ── Markers ──────────────────────────────────────── */
.bl-marker{position:relative;width:24px;height:24px;cursor:pointer}
.bl-marker .core{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:14px;height:14px;border-radius:50%;
  border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.45);
  transition:transform .15s ease;
}
.bl-marker.dist .core{width:12px;height:12px;background:var(--bl-blue)}
.bl-marker.corp .core{background:var(--bl-orange)}
.bl-marker.corp::before,
.bl-marker.corp::after{
  content:"";position:absolute;top:50%;left:50%;width:14px;height:14px;
  margin:-7px 0 0 -7px;border-radius:50%;
  background:rgba(242,104,40,.45);
  animation:bl-pulse 2.2s ease-out infinite;
  pointer-events:none;
}
.bl-marker.corp::after{animation-delay:1.1s}
@keyframes bl-pulse{
  0%{transform:scale(1);opacity:.7}
  100%{transform:scale(2.8);opacity:0}
}
.bl-marker:hover .core{transform:translate(-50%,-50%) scale(1.25)}
.bl-marker.active .core{
  transform:translate(-50%,-50%) scale(1.35);
  box-shadow:0 0 0 1px rgba(0,0,0,.55), 0 0 0 3px var(--bl-orange-soft), 0 2px 8px rgba(0,0,0,.55);
}

/* ── Cluster ──────────────────────────────────────── */
.bl-cluster{
  display:flex;align-items:center;justify-content:center;
  background:rgba(28,28,30,.95);border:2px solid var(--bl-orange);
  color:#fff;border-radius:50%;font-weight:700;font-size:13px;
  box-shadow:0 2px 10px rgba(0,0,0,.55);
}
.bl-cluster.s{width:34px;height:34px;font-size:12px}
.bl-cluster.m{width:42px;height:42px}
.bl-cluster.l{width:52px;height:52px;font-size:14px}

/* ── Detail panel ─────────────────────────────────── */
.bl-panel{
  position:absolute;top:0;right:0;bottom:0;width:var(--panel-w);
  background:var(--bl-surface);border-left:1px solid var(--bl-border);
  box-shadow:var(--bl-shadow);
  transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.7,.2,1);
  display:flex;flex-direction:column;z-index:800;
}
.bl-panel.open{transform:translateX(0)}
.bl-panel-head{
  display:flex;align-items:flex-start;gap:10px;
  padding:18px 20px 14px;border-bottom:1px solid var(--bl-border);
}
.bl-panel-type{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--bl-text-muted);
  margin-bottom:6px;
}
.bl-panel-type .dot{width:10px;height:10px;border-radius:50%}
.bl-panel-type .dot.corp{background:var(--bl-orange);box-shadow:0 0 0 2px rgba(242,104,40,.25)}
.bl-panel-type .dot.dist{background:var(--bl-blue);box-shadow:0 0 0 2px rgba(30,136,229,.25)}
.bl-panel-name{font-size:18px;font-weight:600;line-height:1.3;margin:0}
.bl-panel-region{color:var(--bl-text-muted);font-size:12px;margin-top:4px}
.bl-panel-close{
  margin-left:auto;background:transparent;color:var(--bl-text-muted);border:0;
  cursor:pointer;font-size:22px;line-height:1;padding:4px 6px;border-radius:var(--bl-radius-sm);
}
.bl-panel-close:hover{background:var(--bl-surface2);color:var(--bl-text)}

.bl-panel-body{padding:18px 20px;overflow-y:auto;flex:1 1 auto}
.bl-field{margin-bottom:16px}
.bl-field-label{
  font-size:10px;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--bl-text-dim);margin-bottom:4px;font-weight:600;
}
.bl-field-val{font-size:14px;line-height:1.5;color:var(--bl-text);word-break:break-word}
.bl-field-val a{color:var(--bl-orange-soft);text-decoration:none;border-bottom:1px solid rgba(255,188,125,.3)}
.bl-field-val a:hover{color:var(--bl-orange);border-bottom-color:var(--bl-orange)}
.bl-field-val.muted{color:var(--bl-text-muted);font-style:italic;font-size:13px}

.bl-empty{
  padding:60px 24px;text-align:center;color:var(--bl-text-muted);
}
.bl-empty h3{color:var(--bl-text);margin:0 0 8px;font-weight:500}

/* ── Mobile ───────────────────────────────────────── */
@media (max-width:720px){
  .bl-header{padding:12px 14px}
  .bl-toolbar{padding:10px 12px}
  .bl-toolbar input[type=search]{min-width:0;flex:1 1 100%;max-width:none}
  .bl-count{margin-left:0;width:100%}
  .bl-panel{width:100%;--panel-w:100%}
}
</style>

<script>
/* ── Data: 43 locations from locations_blp+dist-build.xlsx ────────────────
   Data is embedded in the #bl-locations-data script tag above so the page
   works locally (file://) without a fetch. Edit locations.json and re-inline
   for production updates. */

const map = L.map('bl-map', {
  worldCopyJump: true,
  zoomControl: true,
  minZoom: 2,
}).setView([20, 10], 2);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  subdomains: 'abcd', maxZoom: 19,
}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png', {
  subdomains: 'abcd', maxZoom: 19, pane: 'shadowPane',
}).addTo(map);

const cluster = L.markerClusterGroup({
  showCoverageOnHover:false,
  spiderfyOnMaxZoom:true,
  maxClusterRadius:45,
  iconCreateFunction(c){
    const n = c.getChildCount();
    const size = n < 10 ? 's' : n < 50 ? 'm' : 'l';
    return L.divIcon({
      html:`<div class="bl-cluster ${size}">${n}</div>`,
      className:'', iconSize:null,
    });
  }
});
map.addLayer(cluster);

const state = { all:[], filtered:[], type:'all', region:'', q:'', activeId:null };
const markersById = new Map();

function makeMarker(loc, id){
  const isCorp = loc.type === 'Corporate';
  const cls = 'bl-marker ' + (isCorp ? 'corp' : 'dist');
  const icon = L.divIcon({
    html:`<div class="${cls}" data-id="${id}"><div class="core"></div></div>`,
    className:'', iconSize:[24,24], iconAnchor:[12,12],
  });
  const m = L.marker([loc.lat, loc.lng], {icon, riseOnHover:true});
  m.on('click', () => openPanel(id));
  return m;
}

function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function linkifyEmails(s){
  if(!s) return '';
  return escapeHtml(s).replace(/[\w.+-]+@[\w-]+\.[\w.-]+/g, m => `<a href="mailto:${m}">${m}</a>`);
}
function webLink(w){
  if(!w) return '';
  const url = /^https?:\/\//i.test(w) ? w : 'https://' + w;
  return `<a href="${escapeHtml(url)}" target="_blank" rel="noopener">${escapeHtml(w)}</a>`;
}

function openPanel(id){
  const loc = state.all[id]; if(!loc) return;
  state.activeId = id;
  document.querySelectorAll('.bl-marker.active').forEach(el => el.classList.remove('active'));
  const el = document.querySelector(`.bl-marker[data-id="${id}"]`);
  if(el) el.classList.add('active');

  const panel = document.getElementById('bl-panel');
  const isCorp = loc.type === 'Corporate';
  document.getElementById('bl-p-type').innerHTML =
    `<span class="dot ${isCorp?'corp':'dist'}"></span>${escapeHtml(loc.type)}`;
  document.getElementById('bl-p-name').textContent = loc.company;
  document.getElementById('bl-p-region').textContent = loc.region;

  const fields = [
    ['Address', escapeHtml(loc.address) || '<span class="muted">Not provided</span>'],
    ['Contact', escapeHtml(loc.contact) || '<span class="muted">—</span>'],
    ['Phone', loc.phone ? escapeHtml(loc.phone).replace(/\b(\+?[\d\s().\-/]{6,})/g, '<a href="tel:$1">$1</a>') : '<span class="muted">—</span>'],
    ['Email', loc.email ? linkifyEmails(loc.email) : '<span class="muted">—</span>'],
    ['Web',   loc.web   ? webLink(loc.web)        : '<span class="muted">—</span>'],
  ];
  document.getElementById('bl-p-body').innerHTML = fields.map(([l,v]) =>
    `<div class="bl-field"><div class="bl-field-label">${l}</div><div class="bl-field-val">${v}</div></div>`
  ).join('');

  panel.classList.add('open');
  panel.setAttribute('aria-hidden','false');

  // Pan so the marker isn't behind the panel (desktop only)
  if(window.innerWidth > 720){
    const point = map.latLngToContainerPoint([loc.lat, loc.lng]);
    const offset = (parseInt(getComputedStyle(document.documentElement).getPropertyValue('--panel-w'))||380)/2;
    map.panBy([point.x - (map.getSize().x - offset)/2 + offset, 0], {animate:true});
  }
}
function closePanel(){
  const panel = document.getElementById('bl-panel');
  panel.classList.remove('open');
  panel.setAttribute('aria-hidden','true');
  document.querySelectorAll('.bl-marker.active').forEach(el => el.classList.remove('active'));
  state.activeId = null;
}
document.getElementById('bl-p-close').addEventListener('click', closePanel);
document.addEventListener('keydown', e => { if(e.key === 'Escape') closePanel(); });

function applyFilters(){
  const q = state.q.trim().toLowerCase();
  state.filtered = state.all.map((l,i)=>({l,i})).filter(({l}) => {
    if(state.type !== 'all' && l.type !== state.type) return false;
    if(state.region && l.region !== state.region) return false;
    if(q){
      const hay = `${l.company} ${l.region} ${l.contact} ${l.address} ${l.email}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  cluster.clearLayers();
  const layers = [];
  state.filtered.forEach(({l,i}) => {
    let m = markersById.get(i);
    if(!m){ m = makeMarker(l, i); markersById.set(i, m); }
    layers.push(m);
  });
  cluster.addLayers(layers);
  document.getElementById('bl-count-num').textContent = state.filtered.length;
}

function buildRegionOptions(){
  const sel = document.getElementById('bl-region');
  const regions = [...new Set(state.all.map(l => l.region).filter(Boolean))].sort();
  regions.forEach(r => {
    const o = document.createElement('option'); o.value = r; o.textContent = r; sel.appendChild(o);
  });
}

function bindToolbar(){
  document.getElementById('bl-search').addEventListener('input', e => { state.q = e.target.value; applyFilters(); });
  document.getElementById('bl-region').addEventListener('change', e => { state.region = e.target.value; applyFilters(); });
  document.querySelectorAll('.bl-toggle button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.bl-toggle button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      state.type = b.dataset.type;
      applyFilters();
    });
  });
}

try {
  const data = JSON.parse(document.getElementById('bl-locations-data').textContent);
  state.all = data;
  buildRegionOptions();
  bindToolbar();
  applyFilters();
  const bounds = L.latLngBounds(data.map(d => [d.lat, d.lng]));
  if(bounds.isValid()) map.fitBounds(bounds.pad(0.15), {maxZoom:4});
} catch (err) {
  console.error('Failed to load locations:', err);
  document.getElementById('bl-map').innerHTML =
    `<div class="bl-empty"><h3>Could not load locations</h3><p>${err.message}</p></div>`;
}
</script>

</body>
</html>
